<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Event</title>
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="booking.css"> 
</head>
<body>

  <!-- Dynamic Navigation Insert Container -->
  <div id="nav-insert"></div>

  <main>
    <div class="booking-container">
      <section class="booking-box info-box">
        <h2>Event Details</h2>
        <form class="booking-form">
          <div class="form-group event-type-group">
            <label id="event-type-label" for="event-type-trigger">Event Type</label>
            <select id="event-type" name="event-type" class="event-type-native" required tabindex="-1" aria-hidden="true">
              <option value="" selected disabled>Select an event</option>
              <option value="wedding">Wedding</option>
              <option value="party">Party</option>
              <option value="karaoke">Karaoke</option>
              <option value="photo-booth">Photo Booth</option>
            </select>
            <button type="button" class="event-type-trigger" id="event-type-trigger" role="combobox" aria-labelledby="event-type-label event-type-value" aria-haspopup="listbox" aria-expanded="false" aria-controls="event-type-menu">
              <span id="event-type-value">Select an event</span>
              <span aria-hidden="true">&rsaquo;</span>
            </button>
            <div class="event-type-menu" id="event-type-menu" role="listbox" aria-label="Event Type" hidden>
              <button type="button" role="option" data-event-type="wedding" aria-selected="false">Wedding</button>
              <button type="button" role="option" data-event-type="party" aria-selected="false">Party</button>
              <button type="button" role="option" data-event-type="karaoke" aria-selected="false">Karaoke</button>
              <button type="button" role="option" data-event-type="photo-booth" aria-selected="false">Photo Booth</button>
            </div>
            <div class="photo-booth-options" id="photo-booth-options" role="group" aria-label="Photo Booth options" hidden>
              <span>Choose a Photo Booth package</span>
              <button type="button" data-photo-option="digital">Digital — $450</button>
              <button type="button" data-photo-option="printing">Printing — $550</button>
            </div>
          </div>

          <div class="event-pricing" id="event-pricing" aria-live="polite">
            <span id="event-pricing-text">Select an event to view pricing.</span>
            <button type="button" class="change-photo-option" id="change-photo-option" hidden>
              Change Photo Booth option
            </button>
          </div>

          <div class="form-group">
            <label for="music-preference">Music Style / Genre</label>
            <input type="text" id="music-preference" name="music-preference">
          </div>

          <div class="form-group">
            <label for="setup-type">Setup Requirements</label>
            <textarea id="setup-type" name="setup-type" rows="4"></textarea>
          </div>
        </form>
      </section>

      <section class="booking-box calendar-box">
        <div class="calendar-box-header">
          <h2>Select Date &amp; Time</h2>
          <button type="button" id="back-to-calendar" hidden>Back to calendar</button>
          <button type="button" id="back-to-times" hidden>Back to available times</button>
        </div>
        <div class="cal-embed-placeholder" id="calendar-container">
          <div class="calendar-stage" id="calendar-stage">
            <div class="calendar-month">
              <button type="button" id="previous-month" aria-label="Previous month">&lsaquo;</button>
              <h3 id="calendar-month-label" aria-live="polite"></h3>
              <button type="button" id="next-month" aria-label="Next month">&rsaquo;</button>
            </div>
            <table class="month-grid" aria-label="Monthly calendar">
              <thead>
                <tr>
                  <th scope="col">Sun</th>
                  <th scope="col">Mon</th>
                  <th scope="col">Tue</th>
                  <th scope="col">Wed</th>
                  <th scope="col">Thu</th>
                  <th scope="col">Fri</th>
                  <th scope="col">Sat</th>
                </tr>
              </thead>
              <tbody id="calendar-days"></tbody>
            </table>
            <p class="calendar-status" id="calendar-status" aria-live="polite" hidden></p>
          </div>
          <div class="times-stage" id="times-stage" hidden>
            <div class="times-stage-header">
              <h3 id="times-date-label"></h3>
            </div>
            <div class="time-options" id="time-options" aria-label="Available times"></div>
            <p class="calendar-status" id="times-status" aria-live="polite" hidden></p>
          </div>
          <div class="confirmation-stage" id="confirmation-stage" hidden>
            <iframe id="booking-calendar" title="Cal.com booking details" tabindex="-1"></iframe>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script src="nav.js"></script>
  <script src="booking.js"></script>
</body>
</html>
