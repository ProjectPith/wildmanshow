<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Catalog</title>
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="music.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="/index.html" class="logo">THE WILDMAN SHOW</a>
      <nav>
        <a href="/index.html" class="nav-link">HOME</a>
        <a href="/functions/booking/booking.html" class="nav-link">BOOKING</a>
        <a href="/functions/music/music.html" class="nav-link">MUSIC</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="catalog-header">
      <div>
        <h1>Music Catalog</h1>
        <p class="catalog-intro">Browse the sounds behind the show.</p>
      </div>

      <label class="filter-control" for="music-filter">
        <span>FILTER MUSIC BY</span>
        <select id="music-filter" aria-label="Filter music by">
          <option>Genre</option>
          <option>Decade</option>
          <option>Artist</option>
          <option>Title</option>
        </select>
      </label>
    </section>

    <section class="music-grid" aria-label="Music catalog">
      <article class="music-card">
        <div class="album-placeholder" aria-hidden="true">01</div>
        <div class="music-card-content">
          <p class="track-number">TRACK 01</p>
          <h2>PLACEHOLDER</h2>
        </div>
        <p class="artist-name">PLACEHOLDER</p>
      </article>

      <article class="music-card">
        <div class="album-placeholder" aria-hidden="true">02</div>
        <div class="music-card-content">
          <p class="track-number">TRACK 02</p>
          <h2>PLACEHOLDER</h2>
        </div>
        <p class="artist-name">PLACEHOLDER</p>
      </article>

      <article class="music-card">
        <div class="album-placeholder" aria-hidden="true">03</div>
        <div class="music-card-content">
          <p class="track-number">TRACK 03</p>
          <h2>PLACEHOLDER</h2>
        </div>
        <p class="artist-name">PLACEHOLDER</p>
      </article>

      <article class="music-card">
        <div class="album-placeholder" aria-hidden="true">04</div>
        <div class="music-card-content">
          <p class="track-number">TRACK 04</p>
          <h2>PLACEHOLDER</h2>
        </div>
        <p class="artist-name">PLACEHOLDER</p>
      </article>
    </section>
  </main>

</body>
</html>
